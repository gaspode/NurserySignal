name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  TF_VAR_aws_region: eu-west-1
  # OIDC credentials are exported by configure-aws-credentials; no local AWS profile exists on the runner.
  TF_VAR_aws_profile: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: hashicorp/setup-terraform@v3

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ vars.NURSERYSIGNAL_AWS_ROLE_ARN }}

      - name: Verify AWS identity
        run: |
          test "$AWS_REGION" = "eu-west-1"
          account="$(aws sts get-caller-identity --region eu-west-1 --query Account --output text)"
          test "$account" = "185489190783"
          echo "Deploying to AWS account $account in $AWS_REGION"

      - name: Initialize Terraform and build application packages
        run: |
          terraform -chdir=infra init -input=false
          api_url="$(terraform -chdir=infra output -raw api_url)"
          pool_id="$(terraform -chdir=infra output -raw cognito_user_pool_id)"
          client_id="$(terraform -chdir=infra output -raw cognito_app_client_id)"
          VITE_API_URL="$api_url" \
          VITE_AWS_REGION="$AWS_REGION" \
          VITE_COGNITO_USER_POOL_ID="$pool_id" \
          VITE_COGNITO_CLIENT_ID="$client_id" \
            npm --prefix frontend run build
          make build-lambda

      - name: Plan
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra validate
          terraform -chdir=infra plan -input=false -out=tfplan

      - name: Apply reviewed workflow plan
        run: terraform -chdir=infra apply -input=false tfplan

      - name: Invalidate frontend entry point
        run: |
          distribution_id="$(terraform -chdir=infra output -raw frontend_distribution_id)"
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths "/" "/index.html"
