name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: hashicorp/setup-terraform@v3

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://ci.invalid
          VITE_AWS_REGION: eu-west-1
          VITE_COGNITO_USER_POOL_ID: ci_pool
          VITE_COGNITO_CLIENT_ID: ci_client
        run: npm run build

      - name: Initialize Terraform providers
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra init -backend=false -input=false

      - name: Install Python checks
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Test and lint
        run: make check

      - name: Frontend tests
        working-directory: frontend
        run: npm test
